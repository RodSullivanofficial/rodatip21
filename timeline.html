<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oś czasu</title>
    <style>
        body {
            background-color: #000000;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 40px;
        }

        /* Kontener całej osi - to on tworzy czarną linię po lewej */
        .timeline {
            position: relative;
            border-left: 4px solid #fff; /* Gruba pionowa czarna linia */
            padding-left: 25px;            /* Odstęp zawartości od linii */
            display: flex;
            flex-direction: column;
            gap: 40px;                     /* Odstęp między kolejnymi wpisami */
        }

        /* Pojedynczy blok wpisu */
        .timeline-item {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Styl podwójnego kółka na linii */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -39px; /* Idealne wycentrowanie kółka na linii (25px padding + szerokość kółka) */
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 50%;
            box-shadow: 0 0 0 4px #ffffff, 0 0 0 7px #000000; /* Efekt podwójnej czarnej obwódki */
            z-index: 2;
        }

        /* Formatowanie tekstów */
        .timeline-date {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .timeline-name {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="timeline">

        <div class="timeline-item">
            <div class="timeline-date">02.06.2026</div>
            <div class="timeline-name">
                RIP Rec Room.<br>
                2016 - 2026 (Closed on 1.06.2026) <br>
                Bankrupt.
            </div>
        </div>

        <div class="timeline-item">
            <div class="timeline-date">02.06.2026</div>
            <div class="timeline-name">Site Release!</div>
        </div>

    </div>

</body>
</html>
