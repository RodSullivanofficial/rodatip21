<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rodatip21 - Strona</title>
    <style>
        /* Ustawienia całej strony i tła */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            
            /* TUTAJ WSTAWIASZ TŁO */
            /* Podmień link w url() na nazwę swojego pliku np. url('moje-tlo.jpg') */
            background-image: url('assets/IMG/Backgrounds/index/INDEX.jpg'); 
            
            /* background-size: 100% 100%; <-- użyj tego zamiast "cover", jeśli chcesz na siłę rozciągnąć obrazek ignorując jego proporcje */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Ustawienia układu, żeby tekst był po lewej stronie i wyśrodkowany w pionie */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            color: #ffffff; /* Biały tekst dla lepszego kontrastu */
            box-sizing: border-box;
            padding-top: 60px; /* Odstęp od góry na wysokość paska nawigacyjnego */
        }

        /* Górny pasek nawigacyjny - czarny, 0.5 przezroczystości */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: rgba(0, 0, 0, 0.5); /* Czarny z przezroczystością 50% */
            backdrop-filter: blur(10px); /* Subtelne rozmycie tła za paskiem */
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            overflow: hidden; /* Ukrywa tekst, który wychodzi poza pasek */
            z-index: 1000; /* Pasek zawsze na wierzchu */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* Delikatna ramka dolna */
        }

        /* Kontener i animacja przesuwania tekstu w prawo */
        .navbar-text {
            color: #ad3232;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap; /* Blokuje zawijanie tekstu do nowej linii */
            width: 100%;
            animation: marquee 15s linear infinite; /* Czas trwania animacji: 15 sekund */
        }

        /* Reguły animacji przesuwu W PRAWO */
        @keyframes marquee {
            0% {
                transform: translate3d(-100%, 0, 0); /* Start całkowicie po lewej stronie poza ekranem */
            }
            100% {
                transform: translate3d(100vw, 0, 0); /* Koniec całkowicie po prawej stronie poza ekranem */
            }
        }

        /* Pojemnik na tekst z efektem rozmytego szkła (Glassmorphism) */
        .content {
            margin-left: 10%; 
            max-width: 500px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.4); /* Półprzezroczyste czarne tło */
            border-radius: 20px; /* Zaokrąglone rogi */
            backdrop-filter: blur(10px); /* Rozmycie tego co jest pod pojemnikiem */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); /* Delikatny cień */
        }

        /* Duży nick */
        .nickname {
            font-size: 4.5rem;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Cień pod samym tekstem */
            word-wrap: break-word; /* Zapobiega wychodzeniu długiego tekstu poza ramkę */
        }

        /* Tekst Lorem ipsum */
        .lorem-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 0;
            color: #e0e0e0; /* Jasnoszary tekst */
        }

        /* Przycisk pobierania */
        .download-btn {
            display: inline-block;
            margin-top: 25px;
            margin-right: 10px; /* Margines między przyciskami */
            padding: 12px 30px;
            background-color: #0078D7; /* Niebieski kolor (styl Windows/OskarOS) */
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 120, 215, 0.4);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .download-btn:hover {
            background-color: #005a9e;
            transform: translateY(-2px);
        }

        /* Dopasowanie do mniejszych ekranów (telefonów) */
        @media (max-width: 768px) {
            .navbar-text {
                font-size: 0.9rem;
                animation: marquee 2s linear infinite; /* Szybszy scroll na mniejszych ekranach */
            }
            body {
                padding-top: 80px; /* Większy margines na małych ekranach */
                justify-content: center; /* Wyśrodkowanie karty na telefonie */
            }
            .content {
                margin-left: 5%;
                margin-right: 5%;
                padding: 25px;
            }
            .nickname {
                font-size: 3rem;
            }
            .download-btn {
                display: block; /* Przyciski jeden pod drugim na telefonie */
                margin-right: 0;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="navbar-text">OskarOS Download is Unavailable!</div>
    </div>

    <div class="content">
        <h1 class="nickname">rodatip21</h1>
        <p class="lorem-text">
            An Small Game Developer in Unity, CEO at Dimenthia Games, Creator on Youtuber and Creator of OskarOS
        </p>
        <a href="oskaros-download.html" class="download-btn">Download OskarOS</a>
        <a href="projects.html" class="download-btn">My Projects</a>
        <a href="timeline.html" class="download-btn">Timeline</a>
    </div>

</body>
</html>
